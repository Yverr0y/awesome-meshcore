name: Sync links from meshcore-ita

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python .github/scripts/sync_upstream.py

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/sync-meshcore-ita
          commit-message: "Add new entries from meshcore-ita/awesome-meshcore"
          title: "Add new entries from meshcore-ita/awesome-meshcore"
          body-path: /tmp/pr_body.md
          delete-branch: true
